name: Run Tests

# Runs once per PR update. No push trigger: feature branches are only tested
# through their PR, and main is only reached through tested PRs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual re-run from the Actions tab (or the GitHub app)

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true # a new push to the PR cancels the outdated run

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base branch

      # The job always runs and reports "test", so it can be a required check;
      # it just skips the expensive steps when nothing testable changed.
      - name: Detect changes worth testing
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Manual run - running full tests"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "Release PR (version + changelog only) - skipping tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          SKIP=true
          while IFS= read -r f; do
            if [[ ! "$f" =~ \.md$|^\.github/ISSUE_TEMPLATE/|^LICENSE$ ]]; then
              SKIP=false
              break
            fi
          done <<< "$CHANGED"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.changes.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: steps.changes.outputs.skip == 'false'
        run: uv sync --group dev

      - name: Lint (ruff)
        if: steps.changes.outputs.skip == 'false'
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Run tests
        if: steps.changes.outputs.skip == 'false'
        run: uv run pytest tests -v
